[project]
name = "document-analyst"
version = "0.1.0"
description = "Privacy-first local document RAG app built with Streamlit."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "chromadb>=1.5,<2",
  "huggingface_hub>=0.34,<2",
  "llama-cpp-python>=0.3.16,<1",
  "pillow>=10,<13",
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3.10,<1",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "reportlab>=4.2,<5",
  "sentence-transformers>=3,<6",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
document-analyst = "document_analyst.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
