[project]
name = "document-analyst"
version = "0.1.0"
description = "Privacy-first local document RAG app built with Streamlit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.5.9",
  "huggingface_hub>=1.14.0",
  "llama-cpp-python>=0.3.22",
  "pymupdf>=1.27.2.3",
  "pytesseract>=0.3.10",
  "sentence-transformers>=5.4.1",
  "streamlit>=1.57.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
